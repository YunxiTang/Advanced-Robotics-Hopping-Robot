[project]
name = "mujoco-sim"
version = "0.1.0"
description = "Planar Raibert hopping robot reimplemented as a MuJoCo simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "mujoco>=3.13.0",
    "numpy>=2.4.6",
    "osqp>=1.1.3",
    "scipy>=1.17.1",
]
