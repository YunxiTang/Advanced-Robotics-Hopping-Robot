[project]
name = "mujoco-sim"
version = "0.1.0"
description = "3-D biped walking in MuJoCo under a convex MPC controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "mujoco>=3.13.0",
    "numpy>=2.4.6",
    "osqp>=1.1.3",
    "scipy>=1.17.1",
]

[project.scripts]
# one-line launch: `uv run biped --view`
biped = "mujoco_sim.sim:main"

# Needed for the `biped` script to be installed at all: without a build
# backend uv treats this as a virtual project, skips installing it, and
# `uv run biped` fails with "Failed to spawn".
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mujoco_sim"]
